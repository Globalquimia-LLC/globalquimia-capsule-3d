<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cápsula 3D — Visor</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root {
    --navy: #1c405d;
    --blue: #006f9e;
    --cyan: #1dbadf;
    --bg: #f0ecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--bg);
    color: var(--navy);
  }
  header {
    background-color: var(--navy);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    background-color: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tabs button.active { background-color: var(--cyan); color: var(--navy); }

  model-viewer {
    width: 100%;
    height: 78vh;
    background-color: #ffffff;
    --poster-color: transparent;
  }

  .hint {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #6b7c86;
  }
</style>
</head>
<body>

<header>
  <h1>Cápsula Globalquimia — Visor 3D local</h1>
  <div class="tabs">
    <button id="btn-closed" class="active">Cerrada</button>
    <button id="btn-open">Abierta</button>
  </div>
</header>

<model-viewer
  id="viewer"
  src="capsule.glb"
  alt="Cápsula 3D Globalquimia"
  camera-controls
  auto-rotate
  rotation-per-second="18deg"
  shadow-intensity="0.6"
  exposure="1.0"
  environment-image="neutral"
  camera-orbit="30deg 75deg 90mm"
  min-camera-orbit="auto auto 40mm"
  max-camera-orbit="auto auto 200mm"
></model-viewer>

<p class="hint">Arrastra para rotar · rueda del mouse para zoom · doble clic para centrar</p>

<script>
  const viewer = document.getElementById('viewer');
  const btnClosed = document.getElementById('btn-closed');
  const btnOpen = document.getElementById('btn-open');

  btnClosed.addEventListener('click', () => {
    viewer.src = 'capsule.glb';
    btnClosed.classList.add('active');
    btnOpen.classList.remove('active');
  });
  btnOpen.addEventListener('click', () => {
    viewer.src = 'capsule_open.glb';
    btnOpen.classList.add('active');
    btnClosed.classList.remove('active');
  });
</script>

</body>
</html>
