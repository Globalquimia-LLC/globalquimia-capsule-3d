<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Globalquimia — Cápsula 3D</title>
<style>
  :root { --navy:#1c405d; --blue:#006f9e; --cyan:#1dbadf; --bg:#fdfaf5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: var(--bg); font-family: Arial, Helvetica, sans-serif; color: var(--navy);
    padding: 40px 24px;
  }
  img.logo { height: 30px; margin-bottom: 28px; }
  h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 12px 0; }
  p { color: #5b6b74; max-width: 480px; margin: 0 0 30px 0; font-size: 14px; line-height: 1.5; }
  .links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.btn {
    display: inline-block; text-decoration: none; font-weight: 700; font-size: 13px;
    padding: 12px 24px; border-radius: 4px;
  }
  a.primary { background: var(--blue); color: #fff; }
  a.secondary { background: #fff; color: var(--navy); border: 1px solid rgba(28,64,93,0.2); }
</style>
</head>
<body>
  <img class="logo" src="assets/logo-color.png" alt="Globalquimia" />
  <h1>Cápsula 3D — Globalquimia</h1>
  <p>Modelo 3D de una cápsula farmacéutica de dos piezas, con demo interactiva de scroll y diseñador de color en vivo.</p>
  <div class="links">
    <a class="btn primary" href="scroll_full.html">Ver demo interactiva ↗</a>
    <a class="btn secondary" href="visor.html">Visor simple (rotación) ↗</a>
  </div>
</body>
</html>
